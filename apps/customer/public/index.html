<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avero · Your home, cared for</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/">avero<span>✳</span></a><span>Your home, cared for.</span><button id="logout" hidden>Sign out</button></header>
<main><div id="notice" role="status" aria-live="polite"></div>
<section id="auth"><p class="eyebrow">A LITTLE CARE GOES A LONG WAY</p><h1>A clearer path to<br>a happier home.</h1><p>Describe what’s happening. We’ll help you find a safe next step.</p><form id="auth-form"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="current-password"></label><button name="action" value="login">Sign in</button><button name="action" value="signup" class="secondary">Create account</button></form></section>
<section id="workspace" hidden><nav><button data-view="care">Home care</button><button data-view="history">Home History</button><button data-view="assets">My appliances</button></nav><h1>Let’s take care of home.</h1><label>Your home<select id="home-select"></select></label>
<details id="setup"><summary>Add a home or update your profile</summary><form id="home-form"><label>Your name<input name="name" required maxlength="100"></label><label>Home label<input name="label" required placeholder="My home"></label><label>City<input name="city" required placeholder="Islamabad"></label><label>Service area<input name="service_area" required placeholder="F-10"></label><label>Address (optional)<input name="address" maxlength="300"></label><button>Save home</button></form></details><div id="feature-content"></div></section></main><footer>Thoughtful help, one step at a time.</footer></body></html>
